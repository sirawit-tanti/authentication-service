name: authentication-service

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: authentication-service-app

    init: true

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 3000

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-auth:}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      REDIS_MAX_RETRIES_PER_REQUEST: ${REDIS_MAX_RETRIES_PER_REQUEST:-3}

      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-authentication-service}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: >-
        http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

    ports:
      - '${APP_PORT:-3000}:3000'

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

      redis:
        condition: service_healthy
        restart: true

      otel-collector:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    stop_grace_period: 20s

    networks:
      - authentication_network

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: authentication-service-email-worker

    init: true

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development

      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-authentication-service-email-worker}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: >-
        http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-auth-queue}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-authentication-email}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-5}
      EMAIL_JOB_ATTEMPTS: ${EMAIL_JOB_ATTEMPTS:-5}
      EMAIL_JOB_BACKOFF_MS: ${EMAIL_JOB_BACKOFF_MS:-5000}

      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-development}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Authentication Service}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-http://localhost:3000/verify-email}

    command:
      - npm
      - run
      - dev:worker:email

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    depends_on:
      redis:
        condition: service_healthy
        restart: true

      otel-collector:
        condition: service_healthy
        restart: true

    stop_grace_period: 30s

    networks:
      - authentication_network

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: authentication-service-outbox-worker

    init: true

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}

      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-authentication-service-outbox-worker}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: >-
        http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      REDIS_MAX_RETRIES_PER_REQUEST: ${REDIS_MAX_RETRIES_PER_REQUEST:-3}

      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-auth-queue}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-authentication-email}
      EMAIL_JOB_ATTEMPTS: ${EMAIL_JOB_ATTEMPTS:-5}
      EMAIL_JOB_BACKOFF_MS: ${EMAIL_JOB_BACKOFF_MS:-5000}

      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-60000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}

    command:
      - npm
      - run
      - dev:worker:outbox

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

      redis:
        condition: service_healthy
        restart: true

      otel-collector:
        condition: service_healthy
        restart: true

    stop_grace_period: 30s

    networks:
      - authentication_network

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0

    container_name: authentication-service-otel-collector

    restart: unless-stopped

    command:
      - --config=/etc/otelcol/config.yaml

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - '4317:4317'
      - '4318:4318'

    depends_on:
      jaeger:
        condition: service_started
        restart: true

    healthcheck:
      test: ['CMD', '/otelcol', 'validate', '--config=/etc/otelcol/config.yaml']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    stop_grace_period: 20s

    networks:
      - authentication_network

  jaeger:
    image: jaegertracing/jaeger:2.20.0

    container_name: authentication-service-jaeger

    restart: unless-stopped

    ports:
      - '16686:16686'

    stop_grace_period: 20s

    networks:
      - authentication_network

  postgres:
    image: postgres:17-alpine

    container_name: authentication-service-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    stop_grace_period: 30s

    networks:
      - authentication_network

  redis:
    image: redis:8-alpine

    container_name: authentication-service-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--requirepass',
        '${REDIS_PASSWORD}',
      ]

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    stop_grace_period: 20s

    networks:
      - authentication_network

volumes:
  app_node_modules:
  postgres_data:
  redis_data:

networks:
  authentication_network:
    driver: bridge
