name: authentication-service

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: authentication-service-app

    init: true

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 3000

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      REDIS_URL: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

    ports:
      - '${APP_PORT:-3000}:3000'

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

      redis:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    stop_grace_period: 20s

    networks:
      - authentication_network

  postgres:
    image: postgres:17-alpine

    container_name: authentication-service-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    stop_grace_period: 30s

    networks:
      - authentication_network

  redis:
    image: redis:8-alpine

    container_name: authentication-service-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--requirepass',
        '${REDIS_PASSWORD}',
      ]

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    stop_grace_period: 20s

    networks:
      - authentication_network

volumes:
  app_node_modules:
  postgres_data:
  redis_data:

networks:
  authentication_network:
    driver: bridge
